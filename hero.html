<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency — Videos & Reels Viral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Barlow', sans-serif;
            background: #000;
            overflow: hidden;
        }

        /* ── Hero Shell ─────────────────────────────── */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Background Video ───────────────────────── */
        .hero-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* ── Transparent Navbar ─────────────────────── */
        .navbar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 48px;
            flex-shrink: 0;
        }

        .nav-logo {
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.03em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            list-style: none;
        }

        .nav-links li a {
            display: block;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 400;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .nav-links li a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-action {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Button Base ────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: none;
            outline: none;
            border-radius: 2px;
            transition: background-color 0.2s ease, color 0.2s ease;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .btn-solid {
            background: #f8f8f8;
            color: #171717;
            padding: 9px 20px;
        }
        .btn-solid:hover { background: #ffffff; }

        .btn-solid-lg {
            background: #f8f8f8;
            color: #171717;
            padding: 13px 30px;
            font-size: 15px;
        }
        .btn-solid-lg:hover { background: #ffffff; }

        .btn-ghost-lg {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 13px 30px;
            font-size: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-ghost-lg:hover { background: rgba(255, 255, 255, 0.18); }

        /* ── Hero Content ───────────────────────────── */
        .hero-body {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 24px 250px;
        }

        /* ── Featured Badge ─────────────────────────── */
        .badge-wrap {
            margin-bottom: 36px;
        }

        .badge-outer {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 999px;
            padding: 4px;
        }

        .badge-inner {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 6px 18px;
            transition: background-color 0.2s ease;
            cursor: default;
        }

        .badge-outer:hover .badge-inner {
            background: rgba(255, 255, 255, 1);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #171717;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .badge-text {
            font-family: 'Barlow', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #171717;
            letter-spacing: 0.03em;
        }

        /* ── Headline Container (with corner accents) ─── */
        .headline-wrap {
            position: relative;
            display: inline-block;
            padding: 16px 36px;
            margin-bottom: 24px;
        }

        .corner-accent {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #ffffff;
            flex-shrink: 0;
        }
        .corner-accent.tl { top: 0; left: 0; }
        .corner-accent.tr { top: 0; right: 0; }
        .corner-accent.bl { bottom: 0; left: 0; }
        .corner-accent.br { bottom: 0; right: 0; }

        /* ── Headline Text ──────────────────────────── */
        .headline {
            line-height: 1.08;
        }

        .hl-barlow {
            display: block;
            font-family: 'Barlow', sans-serif;
            font-weight: 300;
            font-size: 64px;
            color: #ffffff;
            letter-spacing: -0.025em;
        }

        .hl-serif {
            display: block;
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 64px;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        /* ── Sub-headline ───────────────────────────── */
        .sub-headline {
            font-family: 'Barlow', sans-serif;
            font-weight: 400;
            font-size: 17px;
            color: rgba(255, 255, 255, 0.75);
            max-width: 500px;
            line-height: 1.65;
            margin-bottom: 36px;
        }

        /* ── CTA Buttons ────────────────────────────── */
        .cta-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ── Arrow Icon SVG ─────────────────────────── */
        .arrow-icon {
            flex-shrink: 0;
        }

        /* ── Responsive ─────────────────────────────── */
        @media (max-width: 768px) {
            .navbar { padding: 20px 24px; }
            .nav-links { display: none; }
            .hl-barlow, .hl-serif { font-size: 40px; }
            .headline-wrap { padding: 12px 20px; }
            .hero-body { padding-bottom: 140px; }
        }

        @media (max-width: 480px) {
            .hl-barlow, .hl-serif { font-size: 32px; }
        }
    </style>
</head>
<body>

<section class="hero">

    <!-- Background Video — no overlays, no filters -->
    <video class="hero-video" autoplay loop muted playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260306_074215_04640ca7-042c-45d6-bb56-58b1e8a42489.mp4" type="video/mp4">
    </video>

    <!-- Transparent Navbar -->
    <nav class="navbar">
        <a href="#" class="nav-logo">Agency.</a>

        <ul class="nav-links">
            <li><a href="#">Work</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Pricing</a></li>
        </ul>

        <div class="nav-action">
            <a href="#" class="btn btn-solid">Get Started</a>
        </div>
    </nav>

    <!-- Hero Body -->
    <div class="hero-body">

        <!-- Featured in Fortune Badge -->
        <div class="badge-wrap">
            <div class="badge-outer">
                <div class="badge-inner">
                    <div class="badge-dot"></div>
                    <span class="badge-text">Featured in Fortune</span>
                </div>
            </div>
        </div>

        <!-- Headline with 4 Corner Accents -->
        <div class="headline-wrap">
            <div class="corner-accent tl"></div>
            <div class="corner-accent tr"></div>
            <div class="corner-accent bl"></div>
            <div class="corner-accent br"></div>

            <h1 class="headline">
                <span class="hl-barlow">Agency that makes your</span>
                <span class="hl-serif">videos &amp; reels viral</span>
            </h1>
        </div>

        <!-- Sub-headline -->
        <p class="sub-headline">
            We craft compelling short-form video content that resonates with audiences and drives exponential growth across every social platform.
        </p>

        <!-- CTA Buttons -->
        <div class="cta-group">
            <a href="#" class="btn btn-solid-lg">
                Start Creating
                <svg class="arrow-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <a href="#" class="btn btn-ghost-lg">View Our Work</a>
        </div>

    </div>

</section>

</body>
</html>
